name: d1-sql
# Egy d1/*.sql fájl lefuttatása a D1-en, utána újrapárosítás és weboldal-frissítés (rematch).
# Kézzel: Actions → d1-sql → Run workflow → fájlnév (pl. d1/uj_markak_2026-11-09.sql).

on:
  workflow_dispatch:
    inputs:
      file:
        description: "SQL-fájl (d1/....sql)"
        required: true
        default: "d1/uj_markak_2026-11-09.sql"
        type: string

permissions:
  contents: read

concurrency:
  group: airsofthunter-db
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  D1_API_URL: ${{ vars.D1_API_URL }}
  D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: kódcsomag kicsomagolása
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: gpg --batch --quiet --yes --pinentry-mode loopback --passphrase "$BUNDLE_KEY" -d bundle.tgz.gpg | tar xz
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # a fájlnév env-ként megy át (nem kerül közvetlenül a parancsba); a szkript is ellenőrzi
      - env:
          SQL_FILE: ${{ inputs.file }}
        run: python scraper/run_sql.py "$SQL_FILE"
      - name: Tesztek (hibás besoroló kód soha nem ír az adatbázisba)
        run: python -m unittest discover -s scraper -q
      - run: python scraper/rematch.py
      - name: jelszavas zip (minoseg)
        if: always()
        continue-on-error: true
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          files=$(ls minoseg.csv 2>/dev/null || true)
          if [ -n "$files" ]; then 7z a -tzip -mem=ZipCrypto -p"$ARTIFACT_PASSWORD" minoseg.zip $files >/dev/null; fi
      - uses: actions/upload-artifact@v4       # minőség-őr: javított és ellenőrizendő termékek listája
        continue-on-error: true      # a GitHub tárhelye néha hibázik: a CSV nem kritikus, a futás ettől még sikeres
        timeout-minutes: 3
        if: always()
        with:
          name: minoseg
          path: minoseg.zip
          if-no-files-found: ignore
          retention-days: 14
